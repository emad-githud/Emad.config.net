<script>
/* =========================================================
   Emad Net - Frontend Only (Fixed & Standardized)
   ========================================================= */

/* ---------- SECURITY / HTML ESCAPE (Moved to top) ---------- */
function escapeHTML(value) {
  if (value === null || value === undefined) return "";
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* ---------- CONSTANTS & STATE ---------- */
const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "admin123";

let currentUser = null;
let currentAdmin = false;

/* ---------- SAFE DOM HELPERS ---------- */
function safeSetInnerText(id, value) {
  const el = document.getElementById(id);
  if (el) el.innerText = value;
}

function safeSetInnerHTML(id, value) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = value;
}

function safeToggleClass(id, className, isAdd) {
  const el = document.getElementById(id);
  if (el) {
    if (isAdd) el.classList.add(className);
    else el.classList.remove(className);
  }
}

/* ---------- STORAGE ---------- */
function getUsers() {
  return JSON.parse(localStorage.getItem("emadnet_users") || "[]");
}

function saveUsers(users) {
  localStorage.setItem("emadnet_users", JSON.stringify(users));
}

function getOrders() {
  return JSON.parse(localStorage.getItem("emadnet_orders") || "[]");
}

function saveOrders(orders) {
  localStorage.setItem("emadnet_orders", JSON.stringify(orders));
}

function getPlans() {
  const defaultPlans = [
    { id: 1, name: "اقتصادی", gb: 30, days: 30, price: 79000 },
    { id: 2, name: "حرفه‌ای", gb: 60, days: 60, price: 129000 },
    { id: 3, name: "VIP", gb: 120, days: 90, price: 219000 }
  ];

  const saved = localStorage.getItem("emadnet_plans");
  if (!saved) {
    localStorage.setItem("emadnet_plans", JSON.stringify(defaultPlans));
    return defaultPlans;
  }

  return JSON.parse(saved);
}

function savePlans(plans) {
  localStorage.setItem("emadnet_plans", JSON.stringify(plans));
}

function getCoupons() {
  return JSON.parse(localStorage.getItem("emadnet_coupons") || "[]");
}

function saveCoupons(coupons) {
  localStorage.setItem("emadnet_coupons", JSON.stringify(coupons));
}

/* =========================================================
   PAGE CONTROL
   ========================================================= */
function hideAllPages() {
  safeToggleClass("home-page", "hidden-page", true);
  safeToggleClass("user-page", "hidden-page", true);
  safeToggleClass("admin-page", "hidden-page", true);
}

function showHome() {
  hideAllPages();
  safeToggleClass("home-page", "hidden-page", false);
  loadPlans();
}

function showUserPanel() {
  if (!currentUser) {
    openLogin();
    return;
  }
  hideAllPages();
  safeToggleClass("user-page", "hidden-page", false);
  safeSetInnerText("user-name", currentUser.username);
  loadUserData();
}

function showAdminPanel() {
  if (!currentAdmin) {
    openAdminLogin();
    return;
  }
  hideAllPages();
  safeToggleClass("admin-page", "hidden-page", false);
  loadAdminData();
}

/* =========================================================
   MODALS
   ========================================================= */
function openModal(id) {
  const el = document.getElementById(id);
  if (el) {
    el.classList.remove("hidden");
    el.classList.add("flex");
  }
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) {
    el.classList.add("hidden");
    el.classList.remove("flex");
  }
}

function openLogin() { openModal("login-modal"); }
function closeLogin() { closeModal("login-modal"); }
function openRegister() { closeLogin(); openModal("register-modal"); }
function closeRegister() { closeModal("register-modal"); }
function openAdminLogin() { openModal("admin-login-modal"); }
function closeAdminLogin() { closeModal("admin-login-modal"); }

/* =========================================================
   REGISTER USER
   ========================================================= */
function registerUser() {
  const username = (document.getElementById("register-username")?.value || "").trim();
  const password = document.getElementById("register-password")?.value || "";
  const password2 = document.getElementById("register-password2")?.value || "";

  if (!username || !password) return alert("نام کاربری و رمز عبور را وارد کنید.");
  if (username.length < 3) return alert("نام کاربری باید حداقل ۳ کاراکتر باشد.");
  if (password.length < 6) return alert("رمز عبور باید حداقل ۶ کاراکتر باشد.");
  if (password !== password2) return alert("تکرار رمز عبور صحیح نیست.");

  const users = getUsers();
  if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
    return alert("این نام کاربری قبلاً ثبت شده است.");
  }

  const user = {
    id: Date.now(),
    username,
    password,
    createdAt: new Date().toISOString()
  };

  users.push(user);
  saveUsers(users);

  currentUser = user;
  localStorage.setItem("emadnet_current_user", JSON.stringify(user));

  closeRegister();
  updateHeader();
  showUserPanel();
  alert("حساب شما با موفقیت ساخته شد.");
}

/* =========================================================
   USER LOGIN
   ========================================================= */
function loginUser() {
  const username = (document.getElementById("login-username")?.value || "").trim();
  const password = document.getElementById("login-password")?.value || "";

  if (!username || !password) return alert("نام کاربری و رمز عبور را وارد کنید.");

  const users = getUsers();
  const user = users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);

  if (!user) return alert("نام کاربری یا رمز عبور اشتباه است.");

  currentUser = user;
  localStorage.setItem("emadnet_current_user", JSON.stringify(user));

  closeLogin();
  updateHeader();
  showUserPanel();
}

/* =========================================================
   USER LOGOUT
   ========================================================= */
function logoutUser() {
  currentUser = null;
  localStorage.removeItem("emadnet_current_user");
  updateHeader();
  showHome();
}

/* =========================================================
   ADMIN LOGIN
   ========================================================= */
function loginAdmin() {
  const username = (document.getElementById("admin-username")?.value || "").trim();
  const password = document.getElementById("admin-password")?.value || "";

  if (!username || !password) return alert("نام کاربری و رمز عبور ادمین را وارد کنید.");
  if (username !== ADMIN_USERNAME || password !== ADMIN_PASSWORD) {
    return alert("اطلاعات ورود ادمین اشتباه است.");
  }

  currentAdmin = true;
  sessionStorage.setItem("emadnet_admin", "true");

  closeAdminLogin();
  updateHeader();
  showAdminPanel();
}

/* =========================================================
   ADMIN LOGOUT
   ========================================================= */
function adminLogout() {
  currentAdmin = false;
  sessionStorage.removeItem("emadnet_admin");
  updateHeader();
  showHome();
}

/* =========================================================
   HEADER
   ========================================================= */
function updateHeader() {
  const header = document.getElementById("header-user");
  const adminEntry = document.getElementById("admin-entry");
  if (!header) return;

  if (currentAdmin) {
    header.innerHTML = `
      <button onclick="showAdminPanel()" class="bg-amber-500/10 border border-amber-500/20 text-amber-400 px-4 py-2 rounded-xl text-xs font-bold">
        👑 پنل مدیریت
      </button>`;
    if (adminEntry) adminEntry.classList.add("hidden");
    return;
  }

  if (currentUser) {
    header.innerHTML = `
      <button onclick="showUserPanel()" class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 px-4 py-2 rounded-xl text-xs font-bold">
        👤 ${escapeHTML(currentUser.username)}
      </button>`;
    return;
  }

  header.innerHTML = "";
}

/* =========================================================
   PLANS
   ========================================================= */
function loadPlans() {
  const container = document.getElementById("plans-container");
  if (!container) return;

  const plans = getPlans();
  if (!plans.length) {
    container.innerHTML = `
      <div class="glass rounded-3xl p-8 text-center">
        <div class="text-slate-500">در حال حاضر پلنی موجود نیست.</div>
      </div>`;
    return;
  }

  container.innerHTML = plans.map(plan => `
    <div class="glass glass-hover rounded-3xl p-6 relative overflow-hidden">
      <div class="absolute top-0 right-0 w-24 h-24 bg-indigo-500/10 blur-2xl"></div>
      <div class="relative">
        <div class="text-xs text-indigo-400 font-bold mb-2">Emad Net</div>
        <h3 class="text-xl font-black mb-4">${escapeHTML(plan.name)}</h3>
        <div class="grid grid-cols-2 gap-2 text-xs text-slate-400 mb-5">
          <div class="bg-slate-950 rounded-xl p-3">حجم <b class="text-white">${plan.gb} GB</b></div>
          <div class="bg-slate-950 rounded-xl p-3">مدت <b class="text-white">${plan.days} روز</b></div>
        </div>
        <div class="text-2xl font-black text-indigo-400 mb-5">
          ${Number(plan.price).toLocaleString()} <span class="text-xs text-slate-500">تومان</span>
        </div>
        <button onclick="buyPlan(${plan.id})" class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-xl py-3 font-bold text-sm">
          خرید اشتراک
        </button>
      </div>
    </div>
  `).join("");
}

/* =========================================================
   BUY PLAN
   ========================================================= */
function buyPlan(planId) {
  if (!currentUser) {
    alert("برای خرید اشتراک ابتدا وارد حساب خود شوید.");
    openLogin();
    return;
  }

  const plans = getPlans();
  const plan = plans.find(p => p.id === planId);
  if (!plan) return alert("پلن پیدا نشد.");

  const orders = getOrders();
  const order = {
    id: Date.now(),
    userId: currentUser.id,
    username: currentUser.username,
    planId: plan.id,
    planName: plan.name,
    gb: plan.gb,
    days: plan.days,
    price: plan.price,
    status: "ثبت شده",
    vpnLink: "vless://emad-net-" + Date.now(),
    createdAt: new Date().toISOString()
  };

  orders.unshift(order);
  saveOrders(orders);

  alert("سفارش با موفقیت ثبت شد.\n\nمبلغ: " + Number(plan.price).toLocaleString() + " تومان");
  showUserPanel();
}

/* =========================================================
   USER DATA
   ========================================================= */
function loadUserData() {
  if (!currentUser) return;

  const orders = getOrders().filter(o => o.userId === currentUser.id);

  safeSetInnerText("user-order-count", orders.length);
  safeSetInnerText("user-sub-count", orders.length);

  const volume = orders.reduce((sum, order) => sum + Number(order.gb || 0), 0);
  safeSetInnerText("user-volume", volume + " GB");

  renderUserOrders(orders);
}

/* =========================================================
   USER ORDERS
   ========================================================= */
function renderUserOrders(orders) {
  const container = document.getElementById("user-orders-list");
  const subscriptions = document.getElementById("subscriptions-list");

  const empty = `<div class="text-center text-slate-500 py-8 text-sm">هنوز سفارشی ثبت نکرده‌اید.</div>`;

  if (!orders.length) {
    if (container) container.innerHTML = empty;
    if (subscriptions) subscriptions.innerHTML = empty;
    return;
  }

  const html = orders.map(order => `
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 mb-3">
      <div class="flex justify-between gap-3 mb-3">
        <b>${escapeHTML(order.planName)}</b>
        <span class="text-emerald-400 text-xs">${escapeHTML(order.status)}</span>
      </div>
      <div class="text-xs text-slate-500 mb-3">${order.gb}GB / ${order.days} روز</div>
      <div class="bg-black rounded-xl p-3 text-[11px] text-emerald-400 break-all select-all font-mono">
        ${escapeHTML(order.vpnLink)}
      </div>
    </div>
  `).join("");

  if (container) container.innerHTML = html;
  if (subscriptions) subscriptions.innerHTML = html;
}

/* =========================================================
   ADMIN TABS
   ========================================================= */
function adminTab(tab) {
  document.querySelectorAll(".admin-section").forEach(section => section.classList.add("hidden"));

  const section = document.getElementById("admin-" + tab);
  if (section) section.classList.remove("hidden");

  if (tab === "plans") loadAdminPlans();
  if (tab === "users") loadAdminUsers();
  if (tab === "orders") loadAdminOrders();
  if (tab === "coupons") loadAdminCoupons();
}

/* =========================================================
   ADMIN DATA
   ========================================================= */
function loadAdminData() {
  if (!currentAdmin) return;

  const users = getUsers();
  const orders = getOrders();
  const plans = getPlans();

  const income = orders.reduce((sum, order) => sum + Number(order.price || 0), 0);

  safeSetInnerText("admin-users-count", users.length);
  safeSetInnerText("admin-orders-count", orders.length);
  safeSetInnerText("admin-plans-count", plans.length);
  safeSetInnerText("admin-income", income.toLocaleString() + " تومان");

  loadAdminPlans();
}

/* =========================================================
   ADMIN PLANS
   ========================================================= */
function createPlan() {
  const name = (document.getElementById("plan-name")?.value || "").trim();
  const gb = Number(document.getElementById("plan-gb")?.value || 0);
  const days = Number(document.getElementById("plan-days")?.value || 0);
  const price = Number(document.getElementById("plan-price")?.value || 0);

  if (!name || !gb || !days || !price) return alert("تمام اطلاعات پلن را وارد کنید.");

  const plans = getPlans();
  plans.push({ id: Date.now(), name, gb, days, price });
  savePlans(plans);

  if (document.getElementById("plan-name")) document.getElementById("plan-name").value = "";
  if (document.getElementById("plan-gb")) document.getElementById("plan-gb").value = "";
  if (document.getElementById("plan-days")) document.getElementById("plan-days").value = "";
  if (document.getElementById("plan-price")) document.getElementById("plan-price").value = "";

  loadAdminPlans();
  loadPlans();
  loadAdminData();
  alert("پلن با موفقیت ساخته شد.");
}

function loadAdminPlans() {
  const container = document.getElementById("admin-plans-list");
  if (!container) return;

  const plans = getPlans();
  container.innerHTML = plans.map(plan => `
    <div class="glass rounded-2xl p-4 flex flex-col md:flex-row justify-between gap-4 md:items-center">
      <div>
        <b>${escapeHTML(plan.name)}</b>
        <div class="text-xs text-slate-500 mt-1">
          ${plan.gb}GB / ${plan.days} روز / ${Number(plan.price).toLocaleString()} تومان
        </div>
      </div>
      <button onclick="deletePlan(${plan.id})" class="bg-rose-500/10 border border-rose-500/20 text-rose-400 px-4 py-2 rounded-xl text-xs">
        حذف
      </button>
    </div>
  `).join("");
}

function deletePlan(id) {
  if (!confirm("این پلن حذف شود؟")) return;

  const plans = getPlans().filter(p => p.id !== id);
  savePlans(plans);

  loadAdminPlans();
  loadPlans();
  loadAdminData();
}

/* =========================================================
   ADMIN USERS
   ========================================================= */
function loadAdminUsers() {
  const container = document.getElementById("admin-users-list");
  if (!container) return;

  const users = getUsers();
  if (!users.length) {
    container.innerHTML = `<div class="text-slate-500 text-sm">کاربری وجود ندارد.</div>`;
    return;
  }

  container.innerHTML = users.map(user => `
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 mb-3 flex justify-between items-center">
      <div>
        <div class="font-bold">${escapeHTML(user.username)}</div>
        <div class="text-[10px] text-slate-500 mt-1">شناسه: ${user.id}</div>
      </div>
      <span class="text-emerald-400 text-xs">فعال</span>
    </div>
  `).join("");
}

/* =========================================================
   ADMIN ORDERS
   ========================================================= */
function loadAdminOrders() {
  const container = document.getElementById("admin-orders-list");
  if (!container) return;

  const orders = getOrders();
  if (!orders.length) {
    container.innerHTML = `<div class="text-slate-500 text-sm">سفارشی وجود ندارد.</div>`;
    return;
  }

  container.innerHTML = orders.map(order => `
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 mb-3">
      <div class="flex justify-between mb-2">
        <b>${escapeHTML(order.planName)}</b>
        <span class="text-emerald-400 text-xs">${Number(order.price).toLocaleString()} تومان</span>
      </div>
      <div class="text-xs text-slate-500">کاربر: ${escapeHTML(order.username)}</div>
    </div>
  `).join("");
}

/* =========================================================
   COUPONS
   ========================================================= */
function createCoupon() {
  const code = (document.getElementById("coupon-code")?.value || "").trim().toUpperCase();
  const percent = Number(document.getElementById("coupon-percent")?.value || 0);

  if (!code || !percent) return alert("کد و درصد تخفیف را وارد کنید.");
  if (percent < 1 || percent > 100) return alert("درصد تخفیف باید بین ۱ تا ۱۰۰ باشد.");

  const coupons = getCoupons();
  if (coupons.some(c => c.code === code)) return alert("این کد قبلاً ساخته شده است.");

  coupons.push({ id: Date.now(), code, percent });
  saveCoupons(coupons);

  if (document.getElementById("coupon-code")) document.getElementById("coupon-code").value = "";
  if (document.getElementById("coupon-percent")) document.getElementById("coupon-percent").value = "";

  loadAdminCoupons();
  alert("کد تخفیف ساخته شد.");
}

function loadAdminCoupons() {
  const container = document.getElementById("admin-coupons-list");
  if (!container) return;

  const coupons = getCoupons();
  if (!coupons.length) {
    container.innerHTML = `<div class="text-slate-500 text-sm">کد تخفیفی ساخته نشده است.</div>`;
    return;
  }

  container.innerHTML = coupons.map(coupon => `
    <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex justify-between">
      <b>${escapeHTML(coupon.code)}</b>
      <span class="text-purple-400">${coupon.percent}%</span>
    </div>
  `).join("");
}

/* =========================================================
   BACKUP DEMO
   ========================================================= */
function createBackup() {
  if (!currentAdmin) return;

  const backup = {
    createdAt: new Date().toISOString(),
    users: getUsers(),
    plans: getPlans(),
    orders: getOrders(),
    coupons: getCoupons()
  };

  localStorage.setItem("emadnet_last_backup", JSON.stringify(backup));
  safeSetInnerText("backup-status", "آخرین بکاپ: " + new Date().toLocaleString("fa-IR"));
  alert("بکاپ محلی با موفقیت ساخته شد.\n\nاتصال واقعی به Cloudflare R2 نیازمند Backend است.");
}

function listBackups() {
  const backup = localStorage.getItem("emadnet_last_backup");
  const container = document.getElementById("backup-list");
  if (!container) return;

  if (!backup) {
    container.innerHTML = `<div class="text-slate-500 text-sm">هنوز بکاپی ساخته نشده است.</div>`;
    return;
  }

  const data = JSON.parse(backup);
  container.innerHTML = `
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 text-xs">
      آخرین بکاپ: <span class="text-emerald-400">${new Date(data.createdAt).toLocaleString("fa-IR")}</span>
    </div>`;
}

function restoreBackup() {
  const backup = localStorage.getItem("emadnet_last_backup");
  if (!backup) return alert("هیچ بکاپی برای بازیابی وجود ندارد.");
  if (!confirm("اطلاعات فعلی با بکاپ جایگزین شود؟")) return;

  const data = JSON.parse(backup);
  saveUsers(data.users || []);
  savePlans(data.plans || []);
  saveOrders(data.orders || []);
  saveCoupons(data.coupons || []);

  loadAdminData();
  loadPlans();
  alert("بکاپ با موفقیت بازیابی شد.");
}

/* =========================================================
   STARTUP
   ========================================================= */
document.addEventListener("DOMContentLoaded", () => {
  const savedUser = localStorage.getItem("emadnet_current_user");
  if (savedUser) {
    try { currentUser = JSON.parse(savedUser); } catch { currentUser = null; }
  }

  currentAdmin = sessionStorage.getItem("emadnet_admin") === "true";

  updateHeader();

  if (currentAdmin) {
    showAdminPanel();
  } else if (currentUser) {
    showUserPanel();
  } else {
    showHome();
  }
});
</script>
